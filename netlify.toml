[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Old address for the Private Training page
[[redirects]]
  from = "/one-on-one"
  to = "/private-training"
  status = 301

[[redirects]]
  from = "/one-on-one.html"
  to = "/private-training"
  status = 301
